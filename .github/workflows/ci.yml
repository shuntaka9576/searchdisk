name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Makefile の mkdir -p や rm -rf を Windows でも動かすため Git Bash 固定
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: gofmt check
        if: runner.os != 'Windows'
        run: make fmt-check

      - name: vet
        run: make vet

      - name: test
        run: make test-race

      - name: build (native)
        run: make build

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: cross-build windows/amd64
        run: make build-windows

      - uses: actions/upload-artifact@v4
        with:
          name: searchdisk-windows-amd64
          path: dist/searchdisk.exe
          if-no-files-found: error
