name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -v -race ./...

      - name: build (native)
        run: go build -v ./...

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: cross-build windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o searchdisk.exe ./...

      - uses: actions/upload-artifact@v4
        with:
          name: searchdisk-windows-amd64
          path: searchdisk.exe
          if-no-files-found: error
